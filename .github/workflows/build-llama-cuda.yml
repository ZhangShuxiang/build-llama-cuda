name: Build llama.cpp with CUDA Support

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA Version'
        required: false
        default: '13.3'
        type: choice
        options:
          - '13.3'
          - '12.9'
      cuda_arch:
        description: 'CUDA Architectures'
        required: false
        default: '80;86;89'
        type: choice
        options:
          - '60;61;70;75;80;86;89'  # 广泛兼容 (Pascal+)
          - '70;75;80;86;89'        # Volta+ (V100, RTX 20/30/40)
          - '80;86;89'              # Ampere+ (RTX 30/40)

jobs:
  build-linux-cuda:
    name: Build CUDA Package
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # ✅ 超时保护

    env:
      CUDA_ARCHS: ${{ github.event.inputs.cuda_arch || '80;86;89' }}
      CUDA_VERSION: ${{ github.event.inputs.cuda_version || '13.3' }}

    steps:
    # ============================================
    # 步骤1: 安装系统依赖
    # ============================================
    - name: Install system dependencies
      run: |
        CUDA_PKG="cuda-toolkit-${CUDA_VERSION//./-}"
        # 添加NVIDIA源
        wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        # 安装依赖包
        sudo -E apt -qqy update
        sudo -E apt -qqy install \
          build-essential \
          cmake \
          git \
          wget \
          curl \
          libcurl4-openssl-dev \
          libssl-dev \
          pkg-config \
          ninja-build \
          gcc-12 \
          g++-12 \
          software-properties-common \
          ${CUDA_PKG}
        # 设置GCC版本
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

        # 设置环境变量
        echo "CUDA_PATH=/usr/local/cuda" >> $GITHUB_ENV
        echo "/usr/local/cuda/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

        # 设置系统环境
        export PATH=/usr/local/cuda/bin:$PATH
        export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
    # ============================================
    # 步骤4: 克隆 llama.cpp
    # ============================================
    - name: Clone llama.cpp
      uses: actions/checkout@v5
      with:
        repository: ggml-org/llama.cpp
        ref: master
        path: llama
    # ============================================
    # 步骤5: 编译 llama.cpp (优化版)
    # ============================================
    - name: Build llama.cpp with CUDA
      run: |
        cd llama
        # CMake 配置
        cmake -B build \
          -DGGML_RPC=ON \
          -DGGML_CUDA=ON \
          -DGGML_CUDA_FORCE_MMQ=OFF \
          -DGGML_CUDA_FA_ALL_QUANTS=ON \
          -DGGML_CUDA_F16=ON \
          -DGGML_CUDA_GRAPHS=ON \
          -DCMAKE_CUDA_ARCHITECTURES="$CUDA_ARCHS" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF
        # 编译用cmake--build传target
        cmake --build build -j$(nproc) \
          --target llama-cli \
          --target llama-server \
          --target llama-quantize \
          --target llama-bench \
          --target llama-gguf \
          --target llama-gguf-split \
          --target ggml-rpc-server
        # 列出文件
        ls -la build/bin/
    # ============================================
    # 步骤7: 上传产物
    # ============================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: linux-llama-cuda-${{ github.sha }}
        path: llama/build/bin
    # ============================================
    # 步骤8: 打包产物
    # ============================================
    - name: Package artifacts
      run: |
        tar -czf linux-llama-cuda.tar.gz -C llama/build bin
    # ============================================
    # 步骤9: 发布到 Release
    # ============================================
    - name: Create Release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: linux-llama-cuda.tar.gz
        tag_name: linux-llama-cuda-${{ github.sha }}
