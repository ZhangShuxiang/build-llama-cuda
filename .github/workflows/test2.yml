name: test2

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA版本'
        required: true
        default: '13.4'
        type: choice
        options:
          - '13.4'

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1

jobs:
  build-cuda:
    name: llama-windows-cuda
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ inputs.cuda_version }}
          cuda_arch: x64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
      
          $cudaBin = Join-Path $env:CUDA_PATH "bin\x64"
          $cudaLib = Join-Path $env:CUDA_PATH "lib\x64"
      
          Write-Host "== bin =="
          Get-ChildItem -Path $cudaBin
          Write-Host "== lib\x64 =="
          Get-ChildItem -Path $cudaLib
      
          # DLL 在 bin 目录，命名是 cudart64_13.dll 这种形式
          foreach ($pattern in @("cudart64_*.dll", "cublas64_*.dll", "cublasLt64_*.dll")) {
            Get-ChildItem -Path $cudaBin -Filter $pattern -File |
              Copy-Item -Destination build -Force
          }
      
          Write-Host "== build =="
          Get-ChildItem -Path build
