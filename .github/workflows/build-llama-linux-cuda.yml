name: Build llama-linux-cuda

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA 版本'
        required: true
        default: '13.4.3'
        type: choice
        options:
          - '13.4.3'

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  build-cuda:
    name: llama-linux-cuda
    runs-on: ubuntu-24.04
    container: nvidia/cuda:${{ inputs.cuda_version }}-devel-ubuntu24.04
    permissions:
      contents: write

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            git \
            libssl-dev \
            libcurl4-openssl-dev \
            libgomp1 \
            pkg-config \
            patchelf \
            ca-certificates

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_CUDA=ON \
            -DGGML_RPC=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release -j $(nproc) \
            --target llama-cli llama-server ggml-rpc-server

      - name: CUDA libraries
        run: |
          cudaBin=/usr/local/cuda/lib64
          cp $cudaBin/libcudart.so.*.* ./build/bin/libcudart.so
          cp $cudaBin/libcublas.so.*.* ./build/bin/libcublas.so
          cp $cudaBin/libcublasLt.so.*.* ./build/bin/libcublasLt.so

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-linux-cuda-${{ inputs.cuda_version }}-x64
          path: ./build/bin

      - name: Upload release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: llama-linux-cuda-${{ inputs.cuda_version }}-x64-${{ github.sha }}
          name: llama-linux-cuda-${{ inputs.cuda_version }}-x64
          files: ./build/bin/*
