name: Build llama.cpp with CUDA Support (Windows)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA Version'
        required: false
        default: '13.2.0'
        type: choice
        options:
          - '13.2.0'
          - '12.8.0'
          - '12.6.0'
      cuda_arch:
        description: 'CUDA Architectures'
        required: false
        default: '80;86;89'
        type: choice
        options:
          - '75;80;86;89'           # Turing+ (RTX 20/30/40, CUDA 12.8+)
          - '80;86;89'              # Ampere+ (RTX 30/40)
          - '89;90'                 # Ada Lovelace + Hopper
          - '90'                    # Hopper only

permissions:
  contents: write

jobs:
  build-windows-cuda:
    name: Build CUDA Package (Windows)
    runs-on: windows-2022
    timeout-minutes: 150

    env:
      CUDA_ARCHS: ${{ github.event.inputs.cuda_arch || '80;86;89' }}
      CUDA_VERSION: ${{ github.event.inputs.cuda_version || '13.2.0' }}

    steps:
    # ============================================
    # 步骤1: 安装 CUDA Toolkit (完整安装)
    # ============================================
    # CUDA 13.x 在 Windows 上使用 sub-packages 筛选时，crt/ 目录下的
    # 头文件可能不会被正确安装，导致 "crt/host_config.h: No such file"
    # 因此不使用 sub-packages，让 action 完整安装 CUDA Toolkit
    # ============================================
    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.36
      id: cuda-toolkit
      with:
        cuda: ${{ env.CUDA_VERSION }}
        method: 'local'
        # 不指定 sub-packages，安装完整 CUDA Toolkit

    - name: Verify CUDA installation
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        nvcc --version
        Write-Host "CUDA_PATH: $env:CUDA_PATH"
        if (-not $env:CUDA_PATH) { throw "CUDA_PATH not set" }
        # 验证 crt/host_config.h 是否存在
        $hostConfig = Join-Path $env:CUDA_PATH "include\crt\host_config.h"
        if (-not (Test-Path $hostConfig)) { 
          throw "Missing $hostConfig - CUDA installation may be incomplete" 
        }
        Write-Host "Found: $hostConfig"

    # ============================================
    # 步骤2: 克隆 llama.cpp
    # ============================================
    - name: Clone llama.cpp
      uses: actions/checkout@v5
      with:
        repository: ggml-org/llama.cpp
        ref: master
        path: llama

    # ============================================
    # 步骤3: 编译 llama.cpp (Windows MSVC)
    # ============================================
    - name: Build llama.cpp with CUDA
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        cd llama

        # 使用 Visual Studio 2022 生成器
        cmake -B build `
          -G "Visual Studio 17 2022" -A x64 `
          -DGGML_RPC=ON `
          -DGGML_CUDA=ON `
          -DGGML_CUDA_FORCE_MMQ=OFF `
          -DGGML_CUDA_FA_ALL_QUANTS=ON `
          -DGGML_CUDA_GRAPHS=ON `
          -DCMAKE_CUDA_ARCHITECTURES="$env:CUDA_ARCHS" `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_SHARED_LIBS=OFF

        # 限制并行度防止 OOM
        cmake --build build --config Release -j2 `
          --target llama-cli `
          --target llama-server `
          --target llama-quantize `
          --target llama-bench `
          --target llama-gguf-split `
          --target ggml-rpc-server

    # ============================================
    # 步骤4: 检查产物
    # ============================================
    - name: List build artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $binDir = "llama/build/bin/Release"
        if (-not (Test-Path $binDir)) { throw "Build output directory not found: $binDir" }
        Get-ChildItem -Path $binDir | Format-Table Name, Length, LastWriteTime

    # ============================================
    # 步骤5: 上传产物 (Artifact)
    # ============================================
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows-llama-cuda-${{ github.sha }}
        path: llama/build/bin/Release/*
        if-no-files-found: error

    # ============================================
    # 步骤6: 打包产物 (ZIP)
    # ============================================
    - name: Package artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $source = "llama/build/bin/Release/*"
        $dest   = "windows-llama-cuda.zip"
        Compress-Archive -Path $source -DestinationPath $dest -Force
        if (-not (Test-Path $dest)) { throw "Failed to create zip package" }
        Write-Host "Package created: $dest"
        Get-Item $dest | Format-Table Name, Length

    # ============================================
    # 步骤7: 发布到 Release
    # ============================================
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: windows-llama-cuda.zip
        tag_name: windows-llama-cuda-${{ github.sha }}
        draft: true
        prerelease: true
        generate_release_notes: true
        fail_on_unmatched_files: true
