
name: Build llama-windows-cuda-2

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA版本'
        required: true
        default: '12.4'
        type: choice
        options:
          - '12.4'
          - '13.4'

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1

jobs:
  build-cuda:
    name: llama-windows-cuda-2
    runs-on: windows-2022

    permissions:
      contents: write

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: master

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ inputs.cuda_version }}
          cuda_arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          if ($LASTEXITCODE -ne 0) {
            throw "Ninja installation failed"
          }

      - name: Configure & Build
        shell: cmd
        run: |
          set "VSVARS=C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat"
          if not exist "%VSvars%" (
            echo ERROR: Visual Studio environment script not found
            exit /b 1
          )

          call "%VSvars%" x64
          if errorlevel 1 exit /b 1

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_RPC=ON ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_CURL=OFF ^
            -DLLAMA_BUILD_TESTS=OFF ^
            -DLLAMA_BUILD_EXAMPLES=OFF ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DBUILD_SHARED_LIBS=ON

          if errorlevel 1 exit /b 1

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          if %NINJA_JOBS% LSS 1 set NINJA_JOBS=1

          cmake --build build --config Release --parallel %NINJA_JOBS% --target llama-cli llama-server ggml-rpc-server
          if errorlevel 1 exit /b 1

      - name: Package CUDA runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dst = Join-Path $PWD "build\bin\Release"
          $cudaBin = Join-Path $env:CUDA_PATH "bin"

          if (!(Test-Path $dst)) {
            throw "Build output directory not found: $dst"
          }

          if (!(Test-Path $cudaBin)) {
            throw "CUDA bin directory not found: $cudaBin"
          }

          $patterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll"
          )

          $dlls = @(
            foreach ($pattern in $patterns) {
              Get-ChildItem -Path $cudaBin -Filter $pattern -File
            }
          ) | Sort-Object FullName -Unique

          if ($dlls.Count -eq 0) {
            throw "No CUDA runtime DLLs were found"
          }

          $dlls | Copy-Item -Destination $dst -Force

          Get-ChildItem $dst

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-win-cuda-${{ inputs.cuda_version }}-x64
          path: ./build/bin/Release/
          if-no-files-found: error

      - name: Upload release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: llama-win-cuda-${{ inputs.cuda_version }}-x64-${{ github.sha }}
          name: llama-win-cuda-${{ inputs.cuda_version }}-x64
          files: ./build/bin/Release/*
          fail_on_unmatched_files: true
